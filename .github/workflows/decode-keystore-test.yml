name: Decode Keystore Test

on:
  workflow_dispatch:

jobs:
  decode-test:
    name: Run decode-keystore.sh (smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x ./scripts/decode-keystore.sh

      - name: Prepare sample base64 if not present
        run: |
          if [ -f ./scripts/sample-keystore.b64 ]; then
            echo "Using existing sample-keystore.b64"
          else
            echo "Creating dummy sample-keystore.b64 (NOT a real keystore)"
            # create a small dummy file and base64 it
            echo "dummykeystorecontent" > /tmp/dummy.keystore
            base64 /tmp/dummy.keystore > ./scripts/sample-keystore.b64
          fi

      - name: Run decode script (no signing)
        run: |
          ./scripts/decode-keystore.sh --in ./scripts/sample-keystore.b64 --out /tmp/decoded-keystore.jks

      - name: Check output
        run: |
          if [ -f /tmp/decoded-keystore.jks ]; then
            echo "Decoded keystore exists: /tmp/decoded-keystore.jks";
            ls -l /tmp/decoded-keystore.jks
          else
            echo "Decoded keystore not found"; exit 1;
          fi
